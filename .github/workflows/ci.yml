name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-latest는 arm64다. better-sqlite3가 네이티브 모듈이라 아키텍처마다
        # 따로 깨진다 — 11.x는 Node 24에서, 13.x는 darwin-arm64에서 사고가 났었다.
        # 리눅스만 보면 그걸 못 잡아서 두 아키텍처를 함께 돌린다.
        os: [ubuntu-latest, macos-latest]
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # 사내 이름 금지 목록은 레포에 둘 수 없어 시크릿으로 받는다. 포크 PR에는 시크릿이
      # 안 넘어오므로 그때는 검사가 건너뛰었다고만 남긴다. 로그가 공개라 항목마다 가린다
      - name: Write hygiene denylist
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
        run: |
          if [ -z "$HYGIENE_DENYLIST" ]; then
            echo "HYGIENE_DENYLIST 시크릿이 없어 이름 검사를 건너뜁니다"
            exit 0
          fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done <<< "$HYGIENE_DENYLIST"
          mkdir -p .gestalt
          printf '%s\n' "$HYGIENE_DENYLIST" > .gestalt/hygiene-denylist.txt

      - name: Test with coverage
        run: pnpm test -- --coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24' && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
