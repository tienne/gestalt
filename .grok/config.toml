# Dogfood this checkout. Wins over root `.mcp.json`, which starts the published
# package either way — through scripts/mcp-serve.sh when this repo is installed as
# a plugin, and straight through pinned npx when it is not.
# command/args are resolved from the repo root (Grok session cwd).

[mcp_servers.gestalt]
command = "bash"
args = ["scripts/grok-mcp-serve.sh"]
startup_timeout_sec = 60
tool_timeout_sec = 900
env = { GESTALT_CLIENT = "grok" }
